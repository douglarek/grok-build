name: "Sync Upstream, Auto Tag and Auto Vendor"

'on':
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  push:
    branches:
      - ci-jobs
  workflow_dispatch:
    inputs:
      force:
        description: "Vendor and trigger OBS even if upstream main did not move"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync-and-tag:
    name: Sync Upstream, Auto Tag & Vendor to OBS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ci-jobs branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream main branch
        id: sync
        run: |
          echo "=== Fetching from upstream (xai-org/grok-build) ==="
          git remote add upstream https://github.com/xai-org/grok-build.git || true
          git fetch upstream main
          git fetch origin main

          BEFORE=$(git rev-parse origin/main)
          AFTER=$(git rev-parse upstream/main)
          echo "upstream main: ${BEFORE:0:12} -> ${AFTER:0:12}"

          echo "=== Pushing updated main branch to origin ==="
          git push origin upstream/main:refs/heads/main

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Upstream main unchanged; nothing to sync."
            echo "main_moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "main_moved=true" >> "$GITHUB_OUTPUT"
            echo "commit=$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Version and Process Tags
        id: check_version
        if: steps.sync.outputs.main_moved == 'true' || inputs.force == true
        run: |
          VERSION=$(git show upstream/main:crates/codegen/xai-grok-shell/Cargo.toml | grep -m1 '^version = ' | cut -d '"' -f 2)
          echo "Detected version from upstream Cargo.toml: '$VERSION'"
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to parse version from Cargo.toml"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist. Creating and pushing tag..."
            git tag -a "$TAG" upstream/main -m "Release $TAG (synced from xai-org/grok-build)"
            git push origin "$TAG"
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust toolchain
        if: steps.sync.outputs.main_moved == 'true' || inputs.force == true
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor dependencies and Upload to OBS
        if: steps.sync.outputs.main_moved == 'true' || inputs.force == true
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          VERSION: ${{ steps.check_version.outputs.version }}
          COMMIT: ${{ steps.sync.outputs.commit }}
          NEW_TAG: ${{ steps.check_version.outputs.new_tag }}
        run: |
          COMMIT="${COMMIT:-$(git rev-parse upstream/main)}"

          if [ "$NEW_TAG" = "true" ]; then
            echo "=== Updating committed OBS spec Version to $VERSION (new tag v$VERSION) ==="
            curl -f -u "${OBS_USER}:${OBS_PASSWORD}" -o spec.tmp \
              "https://api.opensuse.org/source/home:douglarek/grok-build/grok-build.spec"
            sed -i "s/^Version:.*/Version:        ${VERSION}/" spec.tmp
            grep -q "^Version:        ${VERSION}$" spec.tmp
            curl -f -u "${OBS_USER}:${OBS_PASSWORD}" -X PUT -T spec.tmp \
              "https://api.opensuse.org/source/home:douglarek/grok-build/grok-build.spec?comment=Set+Version+to+${VERSION}+(tag+v${VERSION})"
            rm -f spec.tmp
          fi
          echo "=== Building vendor.tar.zst from upstream commit ${COMMIT:0:12} (latest tag: v${VERSION}) ==="
          git checkout --detach upstream/main

          cargo vendor vendor

          mkdir -p .cargo
          printf '%s\n' '[source.crates-io]' 'replace-with = "vendored-sources"' '' '[source.vendored-sources]' 'directory = "vendor"' > .cargo/config.toml

          python3 -c '
          import re
          with open("Cargo.lock") as f:
              lock = f.read()
          git_urls = sorted(set(re.findall(r"git\+https://[^\"#]+", lock)))
          with open(".cargo/config.toml", "a") as f:
              for url in git_urls:
                  base_url = url.split("?")[0].replace("git+", "")
                  rev_m = re.search(r"rev=([^&#]+)", url)
                  rev = rev_m.group(1) if rev_m else ""
                  f.write(f"\n[source.\"{url}\"]\ngit = \"{base_url}\"\n")
                  if rev:
                      f.write(f"rev = \"{rev}\"\n")
                  f.write("replace-with = \"vendored-sources\"\n")
          '

          echo "=== Generated .cargo/config.toml ==="
          tail -n 25 .cargo/config.toml

          sudo apt-get update && sudo apt-get install -y zstd
          tar -cf - .cargo/config.toml vendor | zstd -f -T0 -12 -o vendor.tar.zst

          echo "Vendor archive size:"
          ls -lh vendor.tar.zst

          echo "=== Uploading vendor.tar.zst to OBS (home:douglarek/grok-build) ==="
          curl -f -u "${OBS_USER}:${OBS_PASSWORD}" -X PUT -T vendor.tar.zst \
            "https://api.opensuse.org/source/home:douglarek/grok-build/vendor.tar.zst?comment=Automated+vendor+update+for+upstream+commit+${COMMIT:0:12}"

          echo "=== Triggering OBS source service run ==="
          curl -f -u "${OBS_USER}:${OBS_PASSWORD}" -X POST \
            "https://api.opensuse.org/source/home:douglarek/grok-build?cmd=runservice&comment=Triggered+by+upstream+commit+${COMMIT:0:12}"

          echo "=== Triggering OBS rebuild (all repositories) ==="
          curl -f -u "${OBS_USER}:${OBS_PASSWORD}" -X POST \
            "https://api.opensuse.org/build/home:douglarek?cmd=rebuild&package=grok-build&comment=Triggered+by+upstream+commit+${COMMIT:0:12}"

          echo "=== All done ==="
